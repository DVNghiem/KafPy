# Release CI — triggered on version tags (v*.*.*).
# Builds wheels for all supported platforms and publishes to PyPI.
#
# Linux targets (via maturin-action Docker images, cross-compilation NOT QEMU):
#   manylinux_2_28  — glibc ≥ 2.28 (Ubuntu 18.04+, Debian 10+, RHEL 8+)
#   musllinux_1_2   — musl libc (Alpine Linux, scratch containers)
#   Both: x86_64 and aarch64
#
# macOS: native runners — macos-13 (Intel x86_64), macos-latest (Apple Silicon arm64)
# Windows: windows-latest — MSVC toolchain, cmake pre-installed
#
# PyPI publishing uses OIDC trusted publishing (no stored API token).
# Setup required once:
#   1. Create a "pypi" environment in GitHub repo Settings → Environments.
#   2. Add this repo as a trusted publisher on pypi.org:
#      Your projects → kafpy → Publishing → Add a pending publisher.

name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Linux wheels
  # maturin-action runs inside Docker (ghcr.io/rust-cross/maturin-action).
  # aarch64 uses aarch64-linux-gnu-gcc (glibc) / aarch64-linux-musl-gcc (musl) —
  # both are real cross-compilers, not QEMU emulation.
  # rdkafka cmake-build works inside these images (cmake + C toolchain included).
  #
  # musl note: if you hit OpenSSL static linking errors in the musl builds, add
  #   env: OPENSSL_STATIC: "1"
  # to the musl build steps.
  build-linux:
    name: Linux / ${{ matrix.platform.target }} / ${{ matrix.platform.libc }} / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        platform:
          - target: x86_64
            manylinux: 2_28
            libc: manylinux
          - target: aarch64
            manylinux: 2_28
            libc: manylinux
          - target: x86_64
            manylinux: musllinux_1_2
            libc: musl
          - target: aarch64
            manylinux: musllinux_1_2
            libc: musl
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          # rdkafka-sys 4.10.0 / librdkafka 2.12.1 unconditionally includes curl/curl.h
          # even with -DWITH_CURL=0. maturin-action images vary by arch/libc (Debian,
          # AlmaLinux, Alpine) so detect the package manager at runtime.
          # For cross-compilation (aarch64 on x86_64 runner) the cross-compiler uses a
          # separate sysroot (/usr/<triple>/include), not /usr/include, so we must copy
          # the header there too. If no real header is found, a stub satisfies the preprocessor
          # (WITH_CURL=0 means the header content is never actually used).
          before-script-linux: |
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -q && apt-get install -y --no-install-recommends libcurl4-openssl-dev || true
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y libcurl-devel || true
            elif command -v yum >/dev/null 2>&1; then
              yum install -y libcurl-devel || true
            elif command -v apk >/dev/null 2>&1; then
              apk add --no-cache curl-dev zlib-dev || true
            fi
            # librdkafka 2.12.1 unconditionally #includes <curl/curl.h> even with
            # -DWITH_CURL=0. The manylinux_2_28 images ship a partial curl.h at
            # /usr/local/include/curl/ that references curlver.h which is absent.
            # Always overwrite with a self-contained stub so nothing cascades.
            mkdir -p /usr/local/include/curl
            printf '#pragma once\ntypedef void CURL;\ntypedef int CURLcode;\ntypedef long curl_off_t;\nstruct curl_slist { char *data; struct curl_slist *next; };\n' \
              > /usr/local/include/curl/curl.h
            # Propagate stub into cross-compiler sysroots.
            # manylinux_2_28 aarch64 uses triple aarch64-unknown-linux-gnu (crosstool-ng)
            # with sysroot at /usr/<triple>/<triple>/sysroot/.
            for TRIPLE in aarch64-linux-gnu aarch64-unknown-linux-gnu aarch64-linux-musl armv7-linux-musleabihf; do
              [ -d "/usr/$TRIPLE" ] || continue
              for SDIR in "/usr/$TRIPLE/include" "/usr/$TRIPLE/$TRIPLE/sysroot/usr/include"; do
                mkdir -p "$SDIR/curl"
                cp /usr/local/include/curl/curl.h "$SDIR/curl/curl.h"
              done
            done
            # rust-musl-cross images are Ubuntu-based with a musl sysroot at
            # /usr/local/musl/<target>/. The $RUST_MUSL_CROSS_TARGET env var is
            # set by the container. The musl cross-compiler searches this sysroot
            # for headers, not /usr/local/include or /usr/include.
            if [ -n "${RUST_MUSL_CROSS_TARGET:-}" ] && [ -d "/usr/local/musl/${RUST_MUSL_CROSS_TARGET}" ]; then
              MUSL_SYSROOT="/usr/local/musl/${RUST_MUSL_CROSS_TARGET}"
              mkdir -p "${MUSL_SYSROOT}/include/curl"
              cp /usr/local/include/curl/curl.h "${MUSL_SYSROOT}/include/curl/curl.h"
              # rdkafka default features include libz, which causes rdkafka-sys to pass
              # -DWITH_ZLIB=1 to cmake. In musl cross-compile mode cmake's find_library()
              # uses CMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY with an empty root path,
              # so it cannot find the glibc libz.a. Create a cmake toolchain file that
              # sets the musl cross-compiler and explicitly points to the musl libz.a.
              {
                echo 'set(CMAKE_SYSTEM_NAME Linux)'
                echo 'string(REGEX REPLACE "-.*" "" _MUSL_ARCH "$ENV{RUST_MUSL_CROSS_TARGET}")'
                echo 'set(CMAKE_SYSTEM_PROCESSOR "${_MUSL_ARCH}")'
                echo 'set(CMAKE_C_COMPILER $ENV{TARGET_CC})'
                echo 'set(CMAKE_CXX_COMPILER $ENV{TARGET_CXX})'
                echo "set(ZLIB_LIBRARY \"${MUSL_SYSROOT}/lib/libz.a\" CACHE FILEPATH \"\" FORCE)"
                echo "set(ZLIB_INCLUDE_DIR \"${MUSL_SYSROOT}/include\" CACHE PATH \"\" FORCE)"
              } > /tmp/musl-toolchain.cmake
              export CMAKE_TOOLCHAIN_FILE=/tmp/musl-toolchain.cmake
            fi
          args: --release --strip --out dist -i python${{ matrix.python-version }}
          sccache: true

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-linux-${{ matrix.platform.target }}-${{ matrix.platform.libc }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # macOS wheels (universal2 — runs on both Intel x86_64 and Apple Silicon)
  # macos-13 (Intel) is deprecated. macos-latest is arm64 (Apple Silicon).
  # universal2-apple-darwin cross-compiles x86_64 on the arm64 runner and combines
  # both slices with lipo — one wheel works on all modern macOS hardware.
  build-macos:
    name: macOS / universal2 / py${{ matrix.python-version }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --strip --out dist -i python${{ matrix.python-version }}
          sccache: true

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macos-universal2-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # Windows wheels
  # windows-latest = Windows Server 2022, MSVC, cmake pre-installed.
  # rdkafka cmake-build uses the MSVC generator — works on GitHub-hosted runners.
  # If you see cmake generator errors, the issue is usually a missing C++ workload
  # (not the case on github-hosted windows-latest, but can happen on self-hosted).
  build-windows:
    name: Windows / x86_64 / py${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install curl dev headers (rdkafka cmake-build, Windows)
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows
          "INCLUDE=C:\vcpkg\installed\x64-windows\include;$env:INCLUDE" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --strip --out dist -i python${{ matrix.python-version }}
          sccache: true

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-windows-x86_64-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # Source distribution
  # Installs from source require: Rust toolchain + cmake + C compiler.
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Publish to PyPIs
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/kafpy
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: List dist contents
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
