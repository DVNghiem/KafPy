# Preview CI — runs on every PR and push to main.
# Builds the full multi-platform wheel matrix (same platforms as release.yml)
# but does NOT publish to PyPI.

name: Preview

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps (cmake + OpenSSL for rdkafka cmake-build)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cmake libssl-dev

      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cmake libssl-dev

      - run: cargo test

  # Builds a dev wheel with `maturin develop` and runs tests/test_exceptions.py.
  # No Kafka broker required — tests only cover the exception hierarchy.
  python-test:
    name: Python tests (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends cmake libssl-dev

      - run: pip install maturin pytest

      - name: Build and install dev wheel
        run: maturin develop --release

      - run: pytest tests/test_exceptions.py -v

  # Linux wheels (glibc + musl, x86_64 + aarch64)
  build-linux:
    name: Linux / ${{ matrix.platform.target }} / ${{ matrix.platform.libc }} / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        platform:
          - target: x86_64
            manylinux: 2_28
            libc: manylinux
          - target: aarch64
            manylinux: 2_28
            libc: manylinux
          - target: x86_64
            manylinux: musllinux_1_2
            libc: musl
          - target: aarch64
            manylinux: musllinux_1_2
            libc: musl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: --release --strip --out dist -i python${{ matrix.python-version }}
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-${{ matrix.platform.target }}-${{ matrix.platform.libc }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # macOS wheels (universal2 — runs on both Intel x86_64 and Apple Silicon)
  # macos-13 (Intel) is deprecated. macos-latest is arm64 (Apple Silicon).
  # universal2-apple-darwin cross-compiles x86_64 on the arm64 runner and combines
  # both slices with lipo — one wheel works on all modern macOS hardware.
  build-macos:
    name: macOS / universal2 / py${{ matrix.python-version }}
    runs-on: macos-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --strip --out dist -i python${{ matrix.python-version }}
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-macos-universal2-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  # Windows wheels (x86_64)
  build-windows:
    name: Windows / x86_64 / py${{ matrix.python-version }}
    runs-on: windows-latest
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --strip --out dist -i python${{ matrix.python-version }}
          sccache: true

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-x86_64-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
