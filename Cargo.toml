[package]
name = "KafPy"
version = "0.1.0"
edition = "2021"
authors = ["Dang Van Nghiem <vannghiem848@gmail.com>"]
description = "High-performance Rust Kafka consumer"

[lib]
name = "_kafpy"
crate-type = ["cdylib", "rlib"]

[features]
pyo3 = []

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module", "generate-import-lib"] }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"] }

# Async runtime
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
async-trait = "0.1"
tracing = "0.1"  # kept for span context only, no logging configuration
thiserror = "2.0.18"
anyhow = "1.0"
glob = "0.3"
regex = "1"
parking_lot = "0.12"
metrics = "0.24.6"
prometheus-client = "0.24"
num_cpus = "1.16"
rand = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tdigest = "0.2"
dotenvy = "0.15.7"

[target.'cfg(unix)'.dependencies]
rdkafka = { version = "0.39.0" }

[target.'cfg(windows)'.dependencies]
rdkafka = { version = "0.39.0", features = ["cmake-build"] }

[dependencies.async-stream]
version = "0.3"

[dependencies.futures-util]
version = "0.3.32"

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]

[build-dependencies]
pyo3-build-config = "=0.28.3"

[package.metadata.maturin]
name = "kafpy"
python-source = "kafpy"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = true

[dev-dependencies]
serde_json = "1.0"
